name: Build and release

# Every push and pull request is built and tested on an ARM64 machine, the Steam Frame's
# architecture. Pushing a tag such as v0.2.0 also publishes the installable archive that
# scripts/install.sh downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 22.04: the oldest glibc on offer, so the program also runs on a newer SteamOS.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git python3 file

      - name: Work out the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFRAME_NOTIFY_VERSION="${{ steps.version.outputs.number }}"
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the program
        run: |
          file build/frame-notify
          build/frame-notify --version
          test "$(build/frame-notify --version)" = "frame-notify ${{ steps.version.outputs.number }}"

      - name: Package
        run: bash scripts/package-release.sh build "${{ steps.version.outputs.number }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: frame-notify-linux-aarch64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frame-notify-linux-aarch64
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "Frame Notify ${GITHUB_REF_NAME}"
          --generate-notes
